[package]
name = "llm-coreutils"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "what"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive"] }
display-error-chain = "0.2.2"
futures = "0.3.32"
gemini-rust = "1.7.1"
regex = "1.12.1"
serde_json = "1.0.121"
tokio = { version = "^1.47", features = ["full"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing = "0.1.44"

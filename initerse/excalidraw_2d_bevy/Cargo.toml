[package]
name = "excalidraw_2d_bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", default-features=false, features = ["2d", "ui", "dynamic_linking"] }
bevy-inspector-egui = "0.37.0"
bevy_asset_loader = {version="0.27.0", features=["2d"]}
bevy_egui = "0.41.0"
bevy_prototype_lyon = "0.17.0"
bevy_vector_shapes = "0.13.1"
leafwing-input-manager = "0.21.0"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
smallvec = "*"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

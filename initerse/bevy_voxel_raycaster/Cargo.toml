[workspace]
resolver = "3"
members = ["world"]

[package]
name = "voxel-engine"
version = "0.1.0"
edition = "2024"

# [dependencies]
# noise = { version = "0.9.0", features = ["std"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.flamegraph]
inherits = "release"
debug = true

[workspace.dependencies]
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
bevy = { version = "0.19", default-features=false, features = ["file_watcher", "dynamic_linking", "2d", "ui"] }
image = "0.25.10"
rand = "0.10.2"

[dependencies]
bevy = {workspace = true}
log = {workspace = true}
image = {workspace = true}
rand = {workspace = true}
world = {path = "./world"}

[build-dependencies]
wesl = "0.4.0"

